#workspace = 4, monitor 2

#####################################
#           Browsers                #
#####################################

windowrule {
  name = browsers_rules
  match:class = zen|firefox
  #firefox|Brave-browser|Zen
  opacity = 1
  idle_inhibit = fullscreen
}

#####################################
#           vs code                 #
#####################################
windowrule {
  name = vscode_rules
  opacity = 1 0.8
  match:class = codium|Code|code-url-handler
}
#####################################
#           Terminal                #
#####################################

windowrule {
  name = terminal_rules
  opacity = 0.90 0.80
  match:class = ^(kitty|com.mitchellh.ghostty)$
}

#windowrulev2 = float,class:^(cool-retro-term.cool-retro-term)$
#windowrulev2 = opacity 0.80 0.80,class:^(cool-retro-term.cool-retro-term)$

#####################################
#            Telegram               #
#####################################
windowrule {
  name = ims
  workspace = 4
  match:class = ^(org.telegram.desktop)$
}
